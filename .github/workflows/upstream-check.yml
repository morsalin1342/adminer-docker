name: Upstream check

# Weekly comparison of the pinned Adminer version and base image digest with
# upstream. The run fails, and lists what is behind, when a newer Adminer release
# is out or the pinned official image tag has a new digest. It changes nothing.

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/adminer-docker'
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the pins with upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/check-upstream.sh
